<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل الدرجات - School System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{primary:{DEFAULT:'#A88EDB'}}}}}</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/app.css">
</head>
<body class="bg-gray-100">
<div id="app-layout"></div>
<script src="../js/layout.js"></script>
<script>
const auth = getAuth();
if(auth){ renderLayout('markbook.html');
document.getElementById('breadcrumb-slot').innerHTML=`<span class="text-gray-400"><i class="fas fa-home ml-1"></i></span><span class="mx-2 text-gray-300">/</span><span class="font-medium text-gray-700">سجل الدرجات</span>`;

const classData = {
    'الرياضيات 10-أ': {
        students: ['محمد أحمد','سارة خالد','عبدالله فهد','نورة سعد','فيصل محمد','ريم عبدالرحمن'],
        columns: [
            { id:1, name:'اختبار الفصل الأول', type:'Exam',     date:'2025-01-15', complete:true  },
            { id:2, name:'واجب الجبر',          type:'Homework', date:'2025-01-20', complete:true  },
            { id:3, name:'اختبار قصير',         type:'Quiz',     date:'2025-01-25', complete:false },
        ],
        grades: {
            'محمد أحمد':   [85, 90, 78], 'سارة خالد':    [92, 88, 95],
            'عبدالله فهد': [70, 75, 68], 'نورة سعد':     [88, 92, 85],
            'فيصل محمد':   [60, 65, 72], 'ريم عبدالرحمن':[95, 98, 92],
        }
    },
    'اللغة العربية 11-ب': {
        students: ['أحمد سالم','منى عبدالله','خالد يوسف','هند محمد','سعد العمري'],
        columns: [
            { id:1, name:'إملاء الفصل الأول', type:'Quiz', date:'2025-01-10', complete:true  },
            { id:2, name:'تعبير كتابي',        type:'Exam', date:'2025-01-22', complete:true  },
        ],
        grades: {
            'أحمد سالم':   [88, 75], 'منى عبدالله': [95, 90],
            'خالد يوسف':   [72, 68], 'هند محمد':    [80, 85],
            'سعد العمري':  [65, 70],
        }
    },
    'العلوم 10-ب': {
        students: ['ريم الشمري','فهد القحطاني','نوف السعيد','عمر الزهراني'],
        columns: [
            { id:1, name:'اختبار الوحدة الأولى', type:'Exam',     date:'2025-01-18', complete:true  },
            { id:2, name:'تقرير تجربة',           type:'Project',  date:'2025-01-28', complete:false },
        ],
        grades: {
            'ريم الشمري':    [90, 88], 'فهد القحطاني': [78, 82],
            'نوف السعيد':    [95, 91], 'عمر الزهراني': [60, 65],
        }
    },
};

const classes = Object.keys(classData);
let selectedClass = classes[0];
let showAddForm = false;

function getCurrentData() { return classData[selectedClass]; }

function render() {
    const { students, columns, grades } = getCurrentData();
    document.getElementById('page-content').innerHTML = `
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-800"><i class="fas fa-star ml-2 text-purple-500"></i>سجل الدرجات</h2>
        <button onclick="toggleAddForm()" class="flex items-center gap-2 bg-purple-600 text-white px-4 py-2 rounded-xl hover:bg-purple-700 text-sm font-medium">
            <i class="fas fa-plus"></i> إضافة تقييم
        </button>
    </div>

    ${showAddForm ? `
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6">
        <h3 class="font-semibold text-gray-700 mb-4 text-sm"><i class="fas fa-plus-circle ml-2 text-purple-500"></i>إضافة تقييم جديد</h3>
        <div class="grid grid-cols-2 gap-4">
            <div><label class="block text-xs font-medium text-gray-600 mb-1">اسم التقييم *</label>
            <input id="col-name" type="text" class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-300" placeholder="مثال: اختبار الفصل الثاني"></div>
            <div><label class="block text-xs font-medium text-gray-600 mb-1">النوع</label>
            <select id="col-type" class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-300">
                <option value="Exam">اختبار</option>
                <option value="Quiz">اختبار قصير</option>
                <option value="Homework">واجب</option>
                <option value="Project">مشروع</option>
            </select></div>
            <div><label class="block text-xs font-medium text-gray-600 mb-1">التاريخ *</label>
            <input id="col-date" type="date" class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-300"></div>
        </div>
        <div class="flex gap-3 mt-4">
            <button onclick="addColumn()" class="bg-purple-600 text-white px-6 py-2.5 rounded-xl text-sm font-medium hover:bg-purple-700"><i class="fas fa-save ml-1"></i>إضافة</button>
            <button onclick="toggleAddForm()" class="px-6 py-2.5 border border-gray-200 text-gray-600 rounded-xl text-sm hover:bg-gray-50">إلغاء</button>
        </div>
    </div>` : ''}

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-6">
        <select id="class-select" onchange="selectedClass=this.value;render()" class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-300">
            ${classes.map(c=>`<option value="${c}" ${c===selectedClass?'selected':''}>${c}</option>`).join('')}
        </select>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-4 py-3 text-right font-medium text-gray-600 min-w-40">الطالب</th>
                        ${columns.map(c=>`
                        <th class="px-3 py-3 text-center font-medium text-gray-600 min-w-28">
                            <div class="text-xs">${c.name}</div>
                            <div class="text-gray-400 font-normal text-xs mt-0.5">${c.date}</div>
                            ${c.complete?'<span class="inline-block mt-1 px-1.5 py-0.5 bg-green-100 text-green-700 rounded text-xs">مكتمل</span>':''}
                        </th>`).join('')}
                        <th class="px-3 py-3 text-center font-medium text-gray-600">المعدل</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-50">
                    ${students.map(s=>{
                        const g = grades[s] || columns.map(()=>0);
                        const avg = Math.round(g.reduce((a,b)=>a+b,0)/g.length);
                        return `
                        <tr class="hover:bg-gray-50">
                            <td class="px-4 py-3 font-medium text-gray-800">${s}</td>
                            ${g.map(v=>`
                            <td class="px-3 py-3 text-center">
                                <span class="inline-block px-2 py-1 rounded-lg font-bold text-xs ${v>=90?'bg-green-100 text-green-700':v>=75?'bg-blue-100 text-blue-700':v>=60?'bg-orange-100 text-orange-700':'bg-red-100 text-red-700'}">${v||'—'}</span>
                            </td>`).join('')}
                            <td class="px-3 py-3 text-center">
                                <span class="inline-block px-2 py-1 rounded-lg font-bold text-xs ${avg>=90?'bg-green-100 text-green-700':avg>=75?'bg-blue-100 text-blue-700':'bg-orange-100 text-orange-700'}">${avg}%</span>
                            </td>
                        </tr>`;
                    }).join('')}
                </tbody>
            </table>
        </div>
    </div>`;
    document.getElementById('class-select').value = selectedClass;
}

function toggleAddForm() { showAddForm = !showAddForm; render(); }
function addColumn() {
    const name = document.getElementById('col-name').value.trim();
    const type = document.getElementById('col-type').value;
    const date = document.getElementById('col-date').value;
    if (!name || !date) { showFlash('يرجى ملء جميع الحقول المطلوبة.', 'error'); return; }
    const data = getCurrentData();
    data.columns.push({ id: data.columns.length+1, name, type, date, complete: false });
    data.students.forEach(s => { if(data.grades[s]) data.grades[s].push(0); });
    showAddForm = false;
    render();
    showFlash('تم إضافة التقييم بنجاح.');
}

render();
}
</script>
</body>
</html>
