<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الفصول - School System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{primary:{DEFAULT:'#A88EDB'}}}}}</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/app.css">
</head>
<body class="bg-gray-100">
<div id="app-layout"></div>
<script src="../js/layout.js"></script>
<script>
const auth = getAuth();
if(auth){
    if(auth.role_category !== 'Admin'){ window.location.href='dashboard.html'; }
    renderLayout('classes.html');
    document.getElementById('breadcrumb-slot').innerHTML=`
        <span class="text-gray-400"><i class="fas fa-home ml-1"></i></span>
        <span class="mx-2 text-gray-300">/</span>
        <span class="font-medium text-gray-700">الفصول</span>`;

    let classes = [
        { id:1, name:'10-أ', stage:'الصف العاشر',  year:'2024-2025', teacher:'أحمد المعلم',  students:28, status:'active' },
        { id:2, name:'10-ب', stage:'الصف العاشر',  year:'2024-2025', teacher:'سارة المعلمة', students:25, status:'active' },
        { id:3, name:'11-أ', stage:'الصف الحادي عشر', year:'2024-2025', teacher:'خالد المعلم', students:29, status:'active' },
        { id:4, name:'11-ب', stage:'الصف الحادي عشر', year:'2024-2025', teacher:'منى المعلمة', students:26, status:'active' },
        { id:5, name:'12-أ', stage:'الصف الثاني عشر', year:'2024-2025', teacher:'فهد المعلم',  students:28, status:'active' },
    ];

    const stages = ['الصف العاشر','الصف الحادي عشر','الصف الثاني عشر'];
    let filtered = [...classes];
    let showForm = false;
    let editId = null;

    function render() {
        document.getElementById('page-content').innerHTML = `
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-xl font-bold text-gray-800"><i class="fas fa-door-open ml-2 text-purple-500"></i>الفصول</h2>
            <button onclick="openForm()" class="flex items-center gap-2 bg-purple-600 text-white px-4 py-2 rounded-xl hover:bg-purple-700 text-sm font-medium">
                <i class="fas fa-plus"></i> إضافة فصل
            </button>
        </div>

        ${showForm ? `
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6">
            <h3 class="font-semibold text-gray-700 mb-4 text-sm">
                <i class="fas fa-${editId?'edit':'plus-circle'} ml-2 text-purple-500"></i>
                ${editId ? 'تعديل الفصل' : 'إضافة فصل جديد'}
            </h3>
            <div class="grid grid-cols-2 gap-4">
                <div><label class="block text-xs font-medium text-gray-600 mb-1">اسم الفصل *</label>
                <input id="f-name" type="text" value="${editId ? classes.find(c=>c.id===editId).name : ''}"
                    class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-300" placeholder="مثال: 10-أ"></div>

                <div><label class="block text-xs font-medium text-gray-600 mb-1">المرحلة الدراسية *</label>
                <select id="f-stage" class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-300">
                    ${stages.map(s=>`<option ${editId && classes.find(c=>c.id===editId).stage===s?'selected':''}>${s}</option>`).join('')}
                </select></div>

                <div><label class="block text-xs font-medium text-gray-600 mb-1">السنة الدراسية</label>
                <input id="f-year" type="text" value="${editId ? classes.find(c=>c.id===editId).year : '2024-2025'}"
                    class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-300" placeholder="2024-2025"></div>

                <div><label class="block text-xs font-medium text-gray-600 mb-1">المعلم المسؤول</label>
                <input id="f-teacher" type="text" value="${editId ? classes.find(c=>c.id===editId).teacher : ''}"
                    class="w-full px-3 py-2.5 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-300" placeholder="اسم المعلم"></div>
            </div>
            <div class="flex gap-3 mt-4">
                <button onclick="${editId?'saveEdit()':'addClass()'}" class="bg-purple-600 text-white px-6 py-2.5 rounded-xl text-sm font-medium hover:bg-purple-700">
                    <i class="fas fa-save ml-1"></i>${editId?'حفظ التعديل':'إضافة'}
                </button>
                <button onclick="closeForm()" class="px-6 py-2.5 border border-gray-200 text-gray-600 rounded-xl text-sm hover:bg-gray-50">إلغاء</button>
            </div>
        </div>` : ''}

        <!-- Stats -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            ${[
                { label:'إجمالي الفصول',  value: classes.length,                                    icon:'fa-door-open',    color:'purple' },
                { label:'الفصول النشطة', value: classes.filter(c=>c.status==='active').length,      icon:'fa-check-circle', color:'green'  },
                { label:'إجمالي الطلاب', value: classes.reduce((a,c)=>a+c.students,0),              icon:'fa-users',        color:'blue'   },
                { label:'متوسط الفصل',   value: Math.round(classes.reduce((a,c)=>a+c.students,0)/classes.length)||0, icon:'fa-chart-bar', color:'orange' },
            ].map(s=>`
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl flex items-center justify-center
                    ${s.color==='purple'?'bg-purple-50 text-purple-600':s.color==='green'?'bg-green-50 text-green-600':s.color==='blue'?'bg-blue-50 text-blue-600':'bg-orange-50 text-orange-600'}">
                    <i class="fas ${s.icon} text-xl"></i>
                </div>
                <div>
                    <p class="text-2xl font-bold text-gray-800">${s.value}</p>
                    <p class="text-xs text-gray-500">${s.label}</p>
                </div>
            </div>`).join('')}
        </div>

        <!-- Filter -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 mb-6">
            <div class="flex flex-wrap gap-3">
                <div class="flex-1 min-w-48 relative">
                    <i class="fas fa-search absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                    <input id="search-input" type="text" placeholder="بحث..." onkeyup="filterClasses()"
                        class="w-full pr-9 pl-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-300">
                </div>
                <select id="stage-filter" onchange="filterClasses()" class="px-3 py-2 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-purple-300">
                    <option value="">كل المراحل</option>
                    ${stages.map(s=>`<option>${s}</option>`).join('')}
                </select>
            </div>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="px-6 py-3 border-b border-gray-100">
                <span class="text-sm text-gray-500">إجمالي: <strong>${filtered.length}</strong> فصل</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500">الفصل</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500">المرحلة</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500">السنة</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500">المعلم المسؤول</th>
                            <th class="px-6 py-3 text-center text-xs font-medium text-gray-500">عدد الطلاب</th>
                            <th class="px-6 py-3 text-center text-xs font-medium text-gray-500">الحالة</th>
                            <th class="px-6 py-3 text-center text-xs font-medium text-gray-500">إجراءات</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-50">
                        ${filtered.map(c=>`
                        <tr class="hover:bg-gray-50">
                            <td class="px-6 py-3">
                                <div class="flex items-center gap-3">
                                    <div class="w-9 h-9 rounded-xl bg-purple-100 text-purple-700 flex items-center justify-center font-bold text-sm">${c.name}</div>
                                </div>
                            </td>
                            <td class="px-6 py-3 text-gray-600">${c.stage}</td>
                            <td class="px-6 py-3 text-gray-500">${c.year}</td>
                            <td class="px-6 py-3 text-gray-600">${c.teacher || '—'}</td>
                            <td class="px-6 py-3 text-center">
                                <span class="px-2 py-1 bg-blue-50 text-blue-700 rounded-lg text-xs font-bold">${c.students}</span>
                            </td>
                            <td class="px-6 py-3 text-center">
                                <span class="px-2 py-1 rounded-full text-xs font-medium ${c.status==='active'?'bg-green-100 text-green-700':'bg-gray-100 text-gray-500'}">
                                    ${c.status==='active'?'نشط':'مغلق'}
                                </span>
                            </td>
                            <td class="px-6 py-3">
                                <div class="flex items-center justify-center gap-3">
                                    <button onclick="openEdit(${c.id})" class="text-yellow-500 hover:text-yellow-700"><i class="fas fa-edit"></i></button>
                                    <button onclick="toggleStatus(${c.id})" class="text-blue-400 hover:text-blue-600"><i class="fas fa-toggle-${c.status==='active'?'on':'off'}"></i></button>
                                    <button onclick="deleteClass(${c.id})" class="text-red-400 hover:text-red-600"><i class="fas fa-trash"></i></button>
                                </div>
                            </td>
                        </tr>`).join('')}
                    </tbody>
                </table>
            </div>
        </div>`;
    }

    function openForm()  { editId = null; showForm = true;  render(); }
    function closeForm() { editId = null; showForm = false; render(); }
    function openEdit(id){ editId = id;   showForm = true;  render(); }

    function filterClasses() {
        const q = document.getElementById('search-input')?.value.toLowerCase() || '';
        const s = document.getElementById('stage-filter')?.value || '';
        filtered = classes.filter(c =>
            (!q || c.name.toLowerCase().includes(q) || c.teacher.toLowerCase().includes(q)) &&
            (!s || c.stage === s)
        );
        render();
    }

    function addClass() {
        const name    = document.getElementById('f-name').value.trim();
        const stage   = document.getElementById('f-stage').value;
        const year    = document.getElementById('f-year').value.trim();
        const teacher = document.getElementById('f-teacher').value.trim();
        if(!name) { showFlash('اسم الفصل مطلوب.','error'); return; }
        if(classes.find(c=>c.name===name)) { showFlash('هذا الفصل موجود مسبقاً.','error'); return; }
        classes.push({ id: Date.now(), name, stage, year, teacher, students:0, status:'active' });
        filtered = [...classes];
        closeForm();
        showFlash('تم إضافة الفصل بنجاح.');
    }

    function saveEdit() {
        const c = classes.find(x=>x.id===editId);
        c.name    = document.getElementById('f-name').value.trim();
        c.stage   = document.getElementById('f-stage').value;
        c.year    = document.getElementById('f-year').value.trim();
        c.teacher = document.getElementById('f-teacher').value.trim();
        filtered = [...classes];
        closeForm();
        showFlash('تم حفظ التعديل بنجاح.');
    }

    function toggleStatus(id) {
        const c = classes.find(x=>x.id===id);
        c.status = c.status==='active' ? 'inactive' : 'active';
        filtered = [...classes];
        render();
        showFlash(`تم ${c.status==='active'?'تفعيل':'إغلاق'} الفصل.`);
    }

    function deleteClass(id) {
        if(!confirm('حذف هذا الفصل نهائياً؟')) return;
        classes = classes.filter(c=>c.id!==id);
        filtered = [...classes];
        render();
        showFlash('تم حذف الفصل.');
    }

    render();
}
</script>
</body>
</html>
