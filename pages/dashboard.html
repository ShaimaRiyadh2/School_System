<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - School System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{primary:{DEFAULT:'#A88EDB',dark:'#7c5cbf'}}}}}</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../css/app.css">
</head>
<body class="bg-gray-100 text-gray-800">

<div id="app-layout"></div>

<script src="../js/layout.js"></script>
<script>
const auth = getAuth();
if (auth) {
    renderLayout('dashboard.html');
    document.getElementById('breadcrumb-slot').innerHTML = `
        <span class="text-gray-400"><i class="fas fa-home ml-1"></i> الرئيسية</span>
        <span class="mx-2 text-gray-300">/</span>
        <span class="text-gray-700 font-medium">لوحة التحكم</span>`;
    renderDashboard(auth);
}

function renderDashboard(auth) {
    const content = document.getElementById('page-content');

    // ── Admin Dashboard ──────────────────────────────────────
    if (auth.role_category === 'Admin') {
        content.innerHTML = `
        <h2 class="text-xl font-bold text-gray-800 mb-6">
            <i class="fas fa-tachometer-alt ml-2 text-purple-500"></i>
            مرحباً، ${auth.full_name}
        </h2>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            ${[
                { label:'الطلاب',    value:'248', icon:'fa-user-graduate',       color:'blue'   },
                { label:'المعلمون',  value:'32',  icon:'fa-chalkboard-teacher',  color:'green'  },
                { label:'أولياء الأمور', value:'180', icon:'fa-users',           color:'orange' },
                { label:'الفصول',   value:'18',  icon:'fa-door-open',            color:'purple' },
            ].map(c => `
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl flex items-center justify-center
                    ${c.color==='blue'?'bg-blue-100 text-blue-600':c.color==='green'?'bg-green-100 text-green-600':c.color==='orange'?'bg-orange-100 text-orange-600':'bg-purple-100 text-purple-600'}">
                    <i class="fas ${c.icon} text-xl"></i>
                </div>
                <div>
                    <p class="text-2xl font-bold text-gray-800">${c.value}</p>
                    <p class="text-xs text-gray-500">${c.label}</p>
                </div>
            </div>`).join('')}
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
            <!-- Quick Links -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
                <h3 class="font-semibold text-gray-800 mb-4 text-sm"><i class="fas fa-bolt ml-2 text-yellow-500"></i>روابط سريعة</h3>
                <div class="space-y-2">
                    ${[
                        { href:'students.html',   icon:'fa-user-graduate', label:'إضافة طالب',       color:'blue'   },
                        { href:'attendance.html', icon:'fa-calendar-check',label:'تسجيل الحضور',     color:'green'  },
                        { href:'messenger.html',  icon:'fa-envelope',      label:'إرسال رسالة',      color:'purple' },
                        { href:'admin.html',      icon:'fa-cog',           label:'إعدادات النظام',   color:'gray'   },
                    ].map(l => `
                    <a href="${l.href}" class="flex items-center gap-3 p-3 rounded-xl hover:bg-gray-50 transition-colors">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center
                            ${l.color==='blue'?'bg-blue-100 text-blue-600':l.color==='green'?'bg-green-100 text-green-600':l.color==='purple'?'bg-purple-100 text-purple-600':'bg-gray-100 text-gray-600'}">
                            <i class="fas ${l.icon} text-sm"></i>
                        </div>
                        <span class="text-sm text-gray-700">${l.label}</span>
                        <i class="fas fa-chevron-left text-xs text-gray-300 mr-auto"></i>
                    </a>`).join('')}
                </div>
            </div>

            <!-- Attendance Chart -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
                <h3 class="font-semibold text-gray-800 mb-4 text-sm"><i class="fas fa-chart-bar ml-2 text-blue-500"></i>نسبة الحضور هذا الأسبوع</h3>
                <div class="flex items-end gap-2 h-32 mb-2">
                    ${[{d:'أح',v:70},{d:'إث',v:85},{d:'ثل',v:60},{d:'أر',v:95},{d:'خم',v:88},{d:'جم',v:75},{d:'سب',v:92}].map(b=>`
                    <div class="flex-1 flex flex-col items-center gap-1">
                        <span class="text-xs text-gray-500">${b.v}%</span>
                        <div class="w-full rounded-t-md ${b.v>=90?'bg-green-400':b.v>=75?'bg-blue-400':'bg-orange-400'}"
                             style="height:${b.v*0.9}px"></div>
                        <span class="text-xs text-gray-400">${b.d}</span>
                    </div>`).join('')}
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="px-5 py-4 border-b border-gray-100">
                    <h3 class="font-semibold text-gray-800 text-sm"><i class="fas fa-history ml-2 text-gray-400"></i>آخر النشاطات</h3>
                </div>
                <div class="divide-y divide-gray-50">
                    ${[
                        { user:'أحمد المعلم',  action:'سجّل حضور الفصل 10-أ',  time:'منذ 5 د',  color:'green'  },
                        { user:'مدير النظام',  action:'أضاف مستخدماً جديداً',   time:'منذ 20 د', color:'blue'   },
                        { user:'سارة المعلمة', action:'أدخلت درجات الاختبار',   time:'منذ 1 س',  color:'purple' },
                        { user:'أحمد المعلم',  action:'أضاف درساً جديداً',      time:'منذ 2 س',  color:'orange' },
                    ].map(l=>`
                    <div class="px-5 py-3 flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0
                            ${l.color==='green'?'bg-green-100 text-green-700':l.color==='blue'?'bg-blue-100 text-blue-700':l.color==='purple'?'bg-purple-100 text-purple-700':'bg-orange-100 text-orange-700'}">
                            ${l.user.charAt(0)}
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-xs font-medium text-gray-800 truncate">${l.user}</p>
                            <p class="text-xs text-gray-400 truncate">${l.action}</p>
                        </div>
                        <span class="text-xs text-gray-300 flex-shrink-0">${l.time}</span>
                    </div>`).join('')}
                </div>
            </div>
        </div>`;

    // ── Staff Dashboard ──────────────────────────────────────
    } else if (auth.role_category === 'Staff') {
        content.innerHTML = `
        <h2 class="text-xl font-bold text-gray-800 mb-6">
            <i class="fas fa-chalkboard-teacher ml-2 text-purple-500"></i>
            مرحباً، ${auth.full_name}
        </h2>

        <!-- إحصائيات المعلم -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            ${[
                { label:'فصولي',         value:'2',   icon:'fa-door-open',        color:'purple' },
                { label:'طلابي',         value:'53',  icon:'fa-users',            color:'blue'   },
                { label:'دروس اليوم',    value:'3',   icon:'fa-book-open',        color:'green'  },
                { label:'واجبات معلقة', value:'5',   icon:'fa-tasks',            color:'orange' },
            ].map(c=>`
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl flex items-center justify-center
                    ${c.color==='purple'?'bg-purple-100 text-purple-600':c.color==='blue'?'bg-blue-100 text-blue-600':c.color==='green'?'bg-green-100 text-green-600':'bg-orange-100 text-orange-600'}">
                    <i class="fas ${c.icon}"></i>
                </div>
                <div>
                    <p class="text-xl font-bold text-gray-800">${c.value}</p>
                    <p class="text-xs text-gray-500">${c.label}</p>
                </div>
            </div>`).join('')}
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">

            <!-- دروس اليوم -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="px-5 py-4 border-b border-gray-100">
                    <h3 class="font-semibold text-gray-800 text-sm"><i class="fas fa-book-open ml-2 text-blue-500"></i>دروس اليوم</h3>
                </div>
                <div class="divide-y divide-gray-50">
                    ${[
                        { time:'08:00', name:'الرياضيات',         form:'10-أ', done:true  },
                        { time:'10:00', name:'الجبر المتقدم',     form:'11-ب', done:false },
                        { time:'12:00', name:'الإحصاء',           form:'12-أ', done:false },
                    ].map(l=>`
                    <div class="px-5 py-3 flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl flex items-center justify-center text-xs font-bold flex-shrink-0
                            ${l.done?'bg-green-100 text-green-600':'bg-blue-100 text-blue-600'}">${l.time}</div>
                        <div class="flex-1">
                            <p class="text-sm font-medium text-gray-800">${l.name}</p>
                            <p class="text-xs text-gray-400">فصل ${l.form}</p>
                        </div>
                        ${l.done?'<span class="text-xs text-green-500"><i class="fas fa-check-circle"></i></span>':''}
                    </div>`).join('')}
                </div>
                <div class="px-5 py-3 border-t border-gray-50">
                    <a href="planner.html" class="text-xs text-purple-600 hover:underline">عرض الجدول الكامل ←</a>
                </div>
            </div>

            <!-- فصولي -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="px-5 py-4 border-b border-gray-100">
                    <h3 class="font-semibold text-gray-800 text-sm"><i class="fas fa-door-open ml-2 text-green-500"></i>فصولي</h3>
                </div>
                <div class="divide-y divide-gray-50">
                    ${[
                        { name:'10-أ', stage:'الصف العاشر',       count:28, attendance:92 },
                        { name:'11-ب', stage:'الصف الحادي عشر',   count:25, attendance:88 },
                    ].map(f=>`
                    <div class="px-5 py-4">
                        <div class="flex items-center justify-between mb-2">
                            <div>
                                <p class="font-medium text-gray-800 text-sm">${f.name}</p>
                                <p class="text-xs text-gray-400">${f.stage} — ${f.count} طالب</p>
                            </div>
                            <a href="attendance.html" class="text-xs bg-green-100 text-green-700 px-3 py-1 rounded-full hover:bg-green-200">
                                <i class="fas fa-calendar-check ml-1"></i>حضور
                            </a>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="flex-1 bg-gray-100 rounded-full h-1.5">
                                <div class="h-1.5 rounded-full ${f.attendance>=90?'bg-green-400':'bg-blue-400'}" style="width:${f.attendance}%"></div>
                            </div>
                            <span class="text-xs text-gray-500">${f.attendance}%</span>
                        </div>
                    </div>`).join('')}
                </div>
                <div class="px-5 py-3 border-t border-gray-50">
                    <a href="students.html" class="text-xs text-purple-600 hover:underline">عرض كل الطلاب ←</a>
                </div>
            </div>

            <!-- روابط سريعة -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
                <h3 class="font-semibold text-gray-800 mb-4 text-sm"><i class="fas fa-bolt ml-2 text-yellow-500"></i>روابط سريعة</h3>
                <div class="space-y-2">
                    ${[
                        { href:'attendance.html', icon:'fa-calendar-check', label:'تسجيل الحضور',   color:'green'  },
                        { href:'markbook.html',   icon:'fa-star',           label:'إدخال الدرجات',  color:'yellow' },
                        { href:'planner.html',    icon:'fa-book-open',      label:'مخطط الدروس',    color:'blue'   },
                        { href:'messenger.html',  icon:'fa-envelope',       label:'إرسال رسالة',    color:'purple' },
                    ].map(l=>`
                    <a href="${l.href}" class="flex items-center gap-3 p-3 rounded-xl hover:bg-gray-50 transition-colors">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center
                            ${l.color==='green'?'bg-green-100 text-green-600':l.color==='yellow'?'bg-yellow-100 text-yellow-600':l.color==='blue'?'bg-blue-100 text-blue-600':'bg-purple-100 text-purple-600'}">
                            <i class="fas ${l.icon} text-sm"></i>
                        </div>
                        <span class="text-sm text-gray-700">${l.label}</span>
                        <i class="fas fa-chevron-left text-xs text-gray-300 mr-auto"></i>
                    </a>`).join('')}
                </div>
            </div>
        </div>

        <!-- آخر الدرجات المدخلة -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                <h3 class="font-semibold text-gray-800 text-sm"><i class="fas fa-star ml-2 text-yellow-500"></i>آخر الدرجات المدخلة</h3>
                <a href="markbook.html" class="text-xs text-purple-600 hover:underline">عرض الكل ←</a>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500">الطالب</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500">المادة</th>
                            <th class="px-6 py-3 text-center text-xs font-medium text-gray-500">الدرجة</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500">التاريخ</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-50">
                        ${[
                            { name:'محمد أحمد',    subject:'الرياضيات',     grade:85, date:'2025-01-25' },
                            { name:'سارة خالد',    subject:'الرياضيات',     grade:92, date:'2025-01-25' },
                            { name:'عبدالله فهد',  subject:'الجبر',         grade:70, date:'2025-01-24' },
                            { name:'نورة سعد',     subject:'الرياضيات',     grade:88, date:'2025-01-24' },
                        ].map(r=>`
                        <tr class="hover:bg-gray-50">
                            <td class="px-6 py-3 font-medium text-gray-800">${r.name}</td>
                            <td class="px-6 py-3 text-gray-500">${r.subject}</td>
                            <td class="px-6 py-3 text-center">
                                <span class="px-2 py-1 rounded-lg text-xs font-bold
                                    ${r.grade>=90?'bg-green-100 text-green-700':r.grade>=75?'bg-blue-100 text-blue-700':'bg-orange-100 text-orange-700'}">
                                    ${r.grade}
                                </span>
                            </td>
                            <td class="px-6 py-3 text-gray-400 text-xs">${r.date}</td>
                        </tr>`).join('')}
                    </tbody>
                </table>
            </div>
        </div>`;

    // ── Student Dashboard ────────────────────────────────────
    } else if (auth.role_category === 'Student') {
        content.innerHTML = `
        <h2 class="text-xl font-bold text-gray-800 mb-6">
            <i class="fas fa-user-graduate ml-2 text-purple-500"></i>
            مرحباً، ${auth.full_name}
        </h2>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            ${[
                { label:'نسبة الحضور', value:'94%', icon:'fa-calendar-check', color:'green'  },
                { label:'المعدل العام', value:'87%', icon:'fa-star',           color:'yellow' },
                { label:'واجبات معلقة',value:'3',   icon:'fa-tasks',          color:'orange' },
                { label:'رسائل جديدة', value:'2',   icon:'fa-envelope',       color:'purple' },
            ].map(c=>`
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl flex items-center justify-center
                    ${c.color==='green'?'bg-green-100 text-green-600':c.color==='yellow'?'bg-yellow-100 text-yellow-600':c.color==='orange'?'bg-orange-100 text-orange-600':'bg-purple-100 text-purple-600'}">
                    <i class="fas ${c.icon}"></i>
                </div>
                <div>
                    <p class="text-xl font-bold text-gray-800">${c.value}</p>
                    <p class="text-xs text-gray-500">${c.label}</p>
                </div>
            </div>`).join('')}
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
            <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-100">
                    <h3 class="font-semibold text-gray-800 text-sm"><i class="fas fa-book-open ml-2 text-blue-500"></i>دروس اليوم</h3>
                </div>
                <div class="divide-y divide-gray-50">
                    ${[
                        { time:'08:00', name:'الرياضيات',     teacher:'أ. أحمد',  room:'101', hw:false },
                        { time:'10:00', name:'اللغة العربية', teacher:'أ. سارة',  room:'205', hw:true  },
                        { time:'12:00', name:'العلوم',        teacher:'أ. خالد',  room:'Lab1',hw:false },
                    ].map(l=>`
                    <div class="px-6 py-4 flex items-center gap-4">
                        <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center text-xs font-bold flex-shrink-0">${l.time}</div>
                        <div class="flex-1">
                            <p class="font-medium text-gray-800 text-sm">${l.name}</p>
                            <p class="text-xs text-gray-400">${l.teacher} — قاعة ${l.room}</p>
                        </div>
                        ${l.hw?'<span class="text-xs bg-orange-100 text-orange-600 px-2 py-1 rounded-full"><i class="fas fa-tasks ml-1"></i>واجب</span>':''}
                    </div>`).join('')}
                </div>
                <div class="px-6 py-3 border-t border-gray-50">
                    <a href="planner.html" class="text-xs text-purple-600 hover:underline">عرض الجدول الكامل ←</a>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="px-5 py-4 border-b border-gray-100">
                    <h3 class="font-semibold text-gray-800 text-sm"><i class="fas fa-tasks ml-2 text-orange-500"></i>الواجبات</h3>
                </div>
                <div class="divide-y divide-gray-50">
                    ${[
                        { name:'حل تمارين الجبر',      subject:'رياضيات', due:'غداً',    urgent:true  },
                        { name:'قراءة الفصل الثالث',   subject:'عربي',    due:'بعد غد',  urgent:false },
                        { name:'تقرير العلوم',          subject:'علوم',    due:'الأحد',   urgent:false },
                    ].map(hw=>`
                    <div class="px-4 py-3 flex items-start gap-3">
                        <div class="w-2 h-2 rounded-full mt-1.5 flex-shrink-0 ${hw.urgent?'bg-red-400':'bg-gray-300'}"></div>
                        <div>
                            <p class="font-medium text-gray-800 text-sm">${hw.name}</p>
                            <p class="text-xs text-gray-400">${hw.subject}</p>
                            <p class="text-xs mt-1 ${hw.urgent?'text-red-500':'text-gray-400'}"><i class="fas fa-clock ml-1"></i>${hw.due}</p>
                        </div>
                    </div>`).join('')}
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                    <h3 class="font-semibold text-gray-800 text-sm"><i class="fas fa-star ml-2 text-yellow-500"></i>آخر الدرجات</h3>
                    <a href="markbook.html" class="text-xs text-purple-600 hover:underline">عرض الكل ←</a>
                </div>
                <div class="divide-y divide-gray-50">
                    ${[
                        { subject:'الرياضيات',     assessment:'اختبار الفصل', grade:85 },
                        { subject:'اللغة العربية', assessment:'تعبير كتابي',  grade:90 },
                        { subject:'العلوم',        assessment:'اختبار قصير',  grade:78 },
                    ].map(g=>`
                    <div class="px-6 py-3 flex items-center gap-4">
                        <div class="flex-1">
                            <p class="font-medium text-gray-800 text-sm">${g.subject}</p>
                            <p class="text-xs text-gray-400">${g.assessment}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="w-20 bg-gray-100 rounded-full h-1.5">
                                <div class="h-1.5 rounded-full ${g.grade>=90?'bg-green-400':g.grade>=75?'bg-blue-400':'bg-orange-400'}" style="width:${g.grade}%"></div>
                            </div>
                            <span class="text-sm font-bold ${g.grade>=90?'text-green-600':g.grade>=75?'text-blue-600':'text-orange-600'}">${g.grade}</span>
                        </div>
                    </div>`).join('')}
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
                    <h3 class="font-semibold text-gray-800 text-sm"><i class="fas fa-envelope ml-2 text-purple-500"></i>آخر الرسائل</h3>
                    <a href="messenger.html" class="text-xs text-purple-600 hover:underline">عرض الكل ←</a>
                </div>
                <div class="divide-y divide-gray-50">
                    ${[
                        { from:'مدير النظام',  subject:'اجتماع أولياء الأمور', time:'منذ 10 د', unread:true  },
                        { from:'أ. أحمد',      subject:'واجب الرياضيات',       time:'منذ 1 س',  unread:true  },
                        { from:'الإدارة',      subject:'إجازة رسمية',           time:'أمس',      unread:false },
                    ].map(m=>`
                    <div class="px-5 py-3 flex items-center gap-3 ${m.unread?'bg-purple-50':''}">
                        <div class="w-8 h-8 rounded-full bg-purple-100 text-purple-700 flex items-center justify-center font-bold text-xs flex-shrink-0">${m.from.charAt(0)}</div>
