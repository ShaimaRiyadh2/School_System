<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - School System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #402568 0%, #935ee1 60%, #a871ec 100%); }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md" x-data="loginData()">

    <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">

        <!-- Header -->
        <div class="bg-gradient-to-l from-purple-600 to-purple-800 px-8 py-8 text-center">
            <div class="w-16 h-16 bg-white bg-opacity-20 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-graduation-cap text-white text-3xl"></i>
            </div>
            <h1 class="text-white text-2xl font-bold">School System</h1>
            <p class="text-purple-200 text-sm mt-1">نظام إدارة المدرسة</p>
        </div>

        <!-- Form -->
        <div class="px-8 py-8">

            <div x-show="error" class="mb-5 p-3 bg-red-50 border border-red-200 text-red-600 rounded-xl text-sm flex items-center gap-2">
                <i class="fas fa-exclamation-circle"></i>
                <span x-text="error"></span>
            </div>

            <form @submit.prevent="handleLogin">

                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">اسم المستخدم</label>
                    <div class="relative">
                        <span class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">
                            <i class="fas fa-user"></i>
                        </span>
                        <input type="text" id="username" required autofocus
                               class="w-full pr-10 pl-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-400 text-sm"
                               placeholder="أدخل اسم المستخدم">
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">كلمة المرور</label>
                    <div class="relative">
                        <span class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input :type="showPass ? 'text' : 'password'" id="password" required
                               class="w-full pr-10 pl-10 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-400 text-sm"
                               placeholder="أدخل كلمة المرور">
                        <button type="button" @click="showPass = !showPass"
                                class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i :class="showPass ? 'fa-eye-slash' : 'fa-eye'" class="fas text-sm"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" :disabled="loading"
                        class="w-full bg-gradient-to-l from-purple-600 to-purple-800 text-white py-3 rounded-xl font-semibold hover:opacity-90 transition-opacity flex items-center justify-center gap-2 disabled:opacity-60">
                    <i x-show="loading" class="fas fa-spinner fa-spin"></i>
                    <span x-text="loading ? 'جاري الدخول...' : 'تسجيل الدخول'"></span>
                </button>

                <div class="text-center mt-4">
                    <a href="forgot.html" class="text-sm text-purple-600 hover:text-purple-800 hover:underline">
                        نسيت كلمة المرور؟
                    </a>
                </div>

                <div class="mt-5 p-3 bg-purple-50 rounded-xl text-xs text-gray-500">
                    <p class="font-medium text-gray-600 mb-2 text-center">بيانات الدخول التجريبية</p>
                    <div class="space-y-1.5">
                        <div class="flex items-center justify-between bg-white rounded-lg px-3 py-1.5">
                            <span class="text-gray-500">مدير</span>
                            <span><strong class="text-gray-700">admin</strong> / <strong class="text-purple-600">Admin@1234</strong></span>
                        </div>
                        <div class="flex items-center justify-between bg-white rounded-lg px-3 py-1.5">
                            <span class="text-gray-500">معلم</span>
                            <span><strong class="text-gray-700">teacher</strong> / <strong class="text-purple-600">Teacher@123</strong></span>
                        </div>
                        <div class="flex items-center justify-between bg-white rounded-lg px-3 py-1.5">
                            <span class="text-gray-500">طالب</span>
                            <span><strong class="text-gray-700">student</strong> / <strong class="text-purple-600">Student@123</strong></span>
                        </div>
                        <div class="flex items-center justify-between bg-white rounded-lg px-3 py-1.5">
                            <span class="text-gray-500">ولي أمر</span>
                            <span><strong class="text-gray-700">parent</strong> / <strong class="text-purple-600">Parent@123</strong></span>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <p class="text-center text-purple-200 text-xs mt-6">
        School System &copy; 2025
    </p>
</div>

<script>
    const USERS = {
        'admin':   { pass: 'Admin@1234',  role: 'Admin',   name: 'مدير النظام',       role_name: 'Administrator' },
        'teacher': { pass: 'Teacher@123', role: 'Staff',   name: 'أحمد المعلم',       role_name: 'Teacher'       },
        'student': { pass: 'Student@123', role: 'Student', name: 'محمد الطالب',       role_name: 'Student'       },
        'parent':  { pass: 'Parent@123',  role: 'Parent',  name: 'عبدالله ولي الأمر', role_name: 'Parent'        },
    };

    function loginData() {
        return {
            showPass: false,
            loading: false,
            error: '',
            handleLogin() {
                this.loading = true;
                this.error = '';
                const u = document.getElementById('username').value.trim();
                const p = document.getElementById('password').value;
                const user = USERS[u];
                setTimeout(() => {
                    if (user && user.pass === p) {
                        sessionStorage.setItem('auth', JSON.stringify({
                            username: u,
                            full_name: user.name,
                            role_category: user.role,
                            role_name: user.role_name,
                            photo: null
                        }));
                        window.location.href = 'pages/dashboard.html';
                    } else {
                        this.error = 'اسم المستخدم أو كلمة المرور غير صحيحة.';
                        this.loading = false;
                    }
                }, 800);
            }
        }
    }

    if (sessionStorage.getItem('auth')) {
        window.location.href = 'pages/dashboard.html';
    }
</script>

</body>
</html>
